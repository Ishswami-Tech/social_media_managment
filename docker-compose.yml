# Local development data services: Postgres and Redis, nothing else.
#
# Run these, then start the app from your machine with `pnpm dev` and
# `pnpm worker:dev`. Production does not use this file: the deployed web and
# worker services connect to the managed Postgres and Dragonfly on the host,
# through DATABASE_URL and REDIS_URL. To run the app itself in containers
# against those managed services, use docker-compose.prod.yml.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: social_ai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"

volumes:
  pgdata:
  redisdata:
