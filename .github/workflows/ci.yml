name: CI

on:
  push:
    branches: [main, feat]
  pull_request:
  # Builds the image of any commit by hand, without verify: to rebuild what is
  # already running (e.g. for a new platform) without shipping newer code.
  workflow_dispatch:
    inputs:
      ref:
        description: "Full commit SHA, branch or tag to build (default: the selected branch)"
        required: false
        default: ""

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ishswami-tech/social_media_managment

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: social_ai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/social_ai?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-auth-secret-0123456789abcdef
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @platform/database migrate:deploy
      - run: pnpm format:check
      - run: pnpm lint
      # The app build generates next-env.d.ts and .next/types, which the app's tsc run references.
      - run: pnpm --filter web build
      - run: pnpm typecheck
      - run: pnpm test

  # The image Temps runs, for linux/amd64 and linux/arm64. It is the root
  # Dockerfile: one image for both Temps projects, social-media-web and
  # social-media-worker, where SERVICE=worker selects the worker
  # (docs/temps-deployment.md). The cluster runs on an amd64 node and an arm64
  # node (oracle-main), and Temps only places a copy on a node the image has a
  # platform for, so both platforms are required: either leg failing fails the
  # run and nothing is tagged.
  # Each platform builds natively on its own runner (ubuntu-24.04-arm is free for
  # public repositories) and pushes an untagged digest; `image` below combines
  # the two digests into one multi-arch tag.
  # Runs after verify passes on a push to main, or for the ref given to a manual run.
  image-build:
    name: Image (${{ matrix.platform }})
    needs: verify
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'success') ||
       github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        platform: [linux/amd64, linux/arm64]
    outputs:
      sha: ${{ steps.src.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Source
        id: src
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=image-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,ignore-error=true,scope=image-${{ env.PLATFORM_PAIR }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.src.outputs.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags the two digests as one multi-arch image.
  image:
    name: Image
    needs: image-build
    if: always() && needs.image-build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-${{ github.event_name }}-${{ inputs.ref || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-arch image
        id: tags
        working-directory: /tmp/digests
        env:
          SHA: ${{ needs.image-build.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(ls | wc -l)" -eq 2 || { echo "expected 2 digests, got: $(ls)"; exit 1; }
          # Unique per run, so Temps never reuses a cached image for a rebuild.
          ref="${IMAGE}:${SHA::12}-${GITHUB_RUN_NUMBER}"
          args=(-t "$ref")
          if [ "${GITHUB_EVENT_NAME}" = push ]; then args+=(-t "${IMAGE}:main"); fi
          docker buildx imagetools create "${args[@]}" $(printf "${IMAGE}@sha256:%s " *)
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          docker buildx imagetools inspect "${{ steps.tags.outputs.ref }}"
          echo "Image: \`${{ steps.tags.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
